name: CI/Build and test [dev]

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*.rs"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*.rs"
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      OS: Linux
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"

      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
          echo "$PWD/venv/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-cov
          python -m pip install -e ".[dev]"

      - name: Build Rust extension for coverage & run tests
        run: |
          mkdir -p target/llvm-cov-target
          export RUSTFLAGS="-C instrument-coverage"

          # Test pure Rust
          LLVM_PROFILE_FILE="target/llvm-cov-target/cargo-test-%p-%m.profraw" cargo test --no-default-features
          # Test Python and PyO3
          maturin develop
          LLVM_PROFILE_FILE="target/llvm-cov-target/coverage-%p-%m.profraw" pytest -vv --cov-report=xml:coverage-python.xml

      - name: Confirm package installation
        run: |
          echo "Checking for compiled Rust binary in src/:"
          find src -name "*.so"
          echo "Contents of orthosynassign/lib/:"
          ls -F src/orthosynassign/lib/

      - name: Generate Rust LCOV coverage report
        run: |
          cargo llvm-cov report --lcov --output-path coverage-rust.info

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python }}
          path: |
            coverage-python.xml
            coverage-rust.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ matrix.python }}
          env_vars: OS
          files: ./coverage-python.xml,./coverage-rust.info
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
