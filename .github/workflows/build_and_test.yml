name: CI/Build and test [dev]

on:
  push:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["**.py", "pyproject.toml"]
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      OS: Linux
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          cargo clean
          pip install .

      - name: Confirm package installation
        run: |
          echo "Checking for compiled Rust binary in src/:"
          find src -name "*.so"
          echo "Contents of orthosynassign/lib/:"
          ls -F src/orthosynassign/lib/

      - name: Test with pytest
        run: |
          pytest -vv --cov --cov-report=xml

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python }}
          path: coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ matrix.python }}
          env_vars: OS
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
