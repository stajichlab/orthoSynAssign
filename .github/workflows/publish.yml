name: Publish

# Runs when a release/v<version> pull request is merged into main: build the sdist, test it on every supported
# Python, then tag and publish the GitHub release with the sdist attached.
#
# Only an sdist is published. Users install from Bioconda, and pip builds the Rust extension from the sdist.

on:
  pull_request:
    types: [closed]
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-sdist:
    name: Build sdist
    # only merged release PRs opened from this repo by release.yml; skipping here skips every job below
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full commit history without old file contents (treeless clone), so the build can find the last tag
          # while the download stays small as history grows
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check the built version matches the release tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python -m pip install packaging
          python - "${HEAD_REF#release/v}" dist/*.tar.gz <<'PY'
          import sys
          from pathlib import Path
          from packaging.version import Version
          expected = Version(sys.argv[1])
          built = Version(Path(sys.argv[2]).name.removesuffix(".tar.gz").rsplit("-", 1)[1])
          if built != expected:
              sys.exit(f"built version {built} does not match release tag {expected}")
          print(f"built version {built} matches the release tag")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test sdist (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-sdist
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Building the sdist compiles the Rust extension, so the toolchain has to be present
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz

      # Run against the installed package, not the source tree, so pyproject's pythonpath/coverage addopts are out
      - name: Test with pytest
        run: pytest -p no:cacheprovider -o addopts="" tests

  publish:
    needs: test-sdist
    uses: stajichlab/gh_workflows/.github/workflows/release_publish.yml@v2
    permissions:
      contents: write
    with:
      artifact: sdist
      environment: GitHub releases

  # The recipe downloads GitHub's tag archive, so its sha256 can only be computed once publish has created the tag.
  bioconda-sha256:
    needs: publish
    if: needs.publish.outputs.published == 'true' && needs.publish.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Update bioconda/meta.yaml and open a pull request into main
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          archive="$RUNNER_TEMP/${TAG}.tar.gz"
          for attempt in 1 2 3 4 5; do
            curl -fsSL -o "$archive" "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz" && break
            echo "Archive not ready (attempt ${attempt}), retrying"; sleep 10
          done
          [ -s "$archive" ] || { echo "::error::Could not download the ${TAG} archive"; exit 1; }
          SHA256=$(sha256sum "$archive" | cut -d' ' -f1)
          recipe=bioconda/meta.yaml
          sed -i -E -e "s/^(\{% set version = \")[^\"]*(\" %\})/\1${VERSION}\2/" \
            -e "s/^(  number: )[0-9]+/\10/" -e "s/^(  sha256: )[0-9a-f]+/\1${SHA256}/" "$recipe"
          grep -q "set version = \"${VERSION}\"" "$recipe" && grep -q "sha256: ${SHA256}" "$recipe"
          if git diff --quiet -- "$recipe"; then
            echo "bioconda/meta.yaml on main already has ${VERSION} and its sha256"
            exit 0
          fi
          branch="bioconda/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update bioconda recipe to ${VERSION}" -- "$recipe"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update bioconda recipe to ${VERSION}" \
            --body "Sets \`bioconda/meta.yaml\` to the released ${VERSION} with the sha256 of its GitHub tag archive (\`${SHA256}\`). Copy the same change into \`recipes/orthosynassign/meta.yaml\` in bioconda-recipes if the autobump PR has not already done it."
