name: CD/Release
run-name: |
  Publish release - ${{ github.event.inputs.bump_type }}
  ${{ startsWith(github.event.inputs.bump_type, 'pre') && github.event.inputs.preid || '' }}

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump types"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - premajor
          - minor
          - preminor
          - patch
          - prepatch
          - prerelease
      preid:
        description: "Prerelease identifier"
        type: string

jobs:
  prepare-release:
    name: Update Changelog and citation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.query-release-info.outputs.version }}
      release_notes: ${{ steps.query-release-info.outputs.release-notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump changelog version
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: bump
          version: ${{ github.event.inputs.bump_type }}
          preid: ${{ github.event.inputs.preid }}
          keep-unreleased-section: true
          fail-on-empty-release-notes: true

      - name: Get version
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest

      - name: Update Package Versions & Sync Cargo.lock
        run: |
          VERSION=${{ steps.query-release-info.outputs.version }}

          # Update Cargo.toml (Matches the first 'version =' it finds)
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          echo "Updated files to version $VERSION"

          # Sync Cargo.lock to match the updated Cargo.toml version
          cargo check
          echo "Updated Cargo.lock successfully"

      - name: Bump CITATION.cff version
        run: |
          VERSION=${{ steps.query-release-info.outputs.version }}
          DATE=$(date -u +%Y-%m-%d)

          if [ -f CITATION.cff ]; then
            sed -i "s/^version: .*/version: $VERSION/" CITATION.cff
            sed -i "s/^date-released: .*/date-released: '$DATE'/" CITATION.cff
          else
            echo "CITATION.cff not found, skipping update."
          fi

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Release v${{ steps.query-release-info.outputs.version }}"

      - name: Create Commit Patch
        run: |
          git format-patch -1 HEAD --stdout > release-commit.patch

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release-commit.patch

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install build tool
        run: python -m pip install build

      - name: Build Source Distribution (sdist)
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test sdist
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install pip and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Install from sdist
        run: |
          python -m pip install dist/*.tar.gz

      - name: Test with pytest
        run: |
          pytest -vv tests

  publish_release:
    name: Publish release
    environment: GitHub releases
    runs-on: ubuntu-latest
    needs: [prepare-release, build-sdist, test-sdist]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Push the updated commits
        run: |
          git push --follow-tags

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare-release.outputs.release_notes }}
          tag_name: v${{ needs.prepare-release.outputs.version }}
          prerelease: ${{ github.event.inputs.bump_type == 'prerelease' }}
          make_latest: ${{ github.event.inputs.bump_type != 'prerelease' }}
          files: dist/*.tar.gz
