version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    # orthosynassign bundles a Rust extension built by maturin, so installing it below needs a toolchain
    rust: "latest"
  jobs:
    post_checkout:
      # Read the Docs clones shallowly; fetch the full history and tags so the build sees the release tags.
      # A treeless fetch is not used here because git cannot convert an existing shallow clone into one reliably.
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
