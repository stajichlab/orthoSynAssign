[package]
name = "orthosynassign"
version = "1.3.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
